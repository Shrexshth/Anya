# Emotion engine baseline dimensions, decay rates, scoring formulas, and appraisal tables.

# Voice styles for Piper TTS and pitch shifting (WP4)
voice_styles:
  baseline:
    length_scale: 1.00
    noise_scale: 0.667
    noise_w: 0.800
    pitch_shift: 1.000

  angry:
    length_scale: 0.82
    noise_scale: 0.900
    noise_w: 0.950
    pitch_shift: 1.050

  sad:
    length_scale: 1.30
    noise_scale: 0.350
    noise_w: 0.400
    pitch_shift: 0.920

  romantic:
    length_scale: 1.20
    noise_scale: 0.450
    noise_w: 0.600
    pitch_shift: 0.970

  excited:
    length_scale: 0.80
    noise_scale: 0.950
    noise_w: 0.950
    pitch_shift: 1.100

  happy:
    length_scale: 0.88
    noise_scale: 0.750
    noise_w: 0.850
    pitch_shift: 1.050

  shy:
    length_scale: 1.15
    noise_scale: 0.500
    noise_w: 0.650
    pitch_shift: 1.030

  smug:
    length_scale: 1.05
    noise_scale: 0.700
    noise_w: 0.850
    pitch_shift: 1.020

  thinking:
    length_scale: 1.18
    noise_scale: 0.550
    noise_w: 0.600
    pitch_shift: 0.970

  sleepy:
    length_scale: 1.40
    noise_scale: 0.300
    noise_w: 0.350
    pitch_shift: 0.900

  surprised:
    length_scale: 0.85
    noise_scale: 0.850
    noise_w: 0.900
    pitch_shift: 1.120

# Personality mode mood baselines (8 dimensions, 0.0 to 1.0)
mode_baselines:
  friend_roast:
    happiness: 0.65
    anger: 0.10
    sadness: 0.05
    affection: 0.40
    energy: 0.70
    playfulness: 0.80
    boredom: 0.10
    anxiety: 0.05

  romantic:
    happiness: 0.75
    anger: 0.02
    sadness: 0.05
    affection: 0.85
    energy: 0.60
    playfulness: 0.50
    boredom: 0.05
    anxiety: 0.05

  study:
    happiness: 0.55
    anger: 0.05
    sadness: 0.05
    affection: 0.35
    energy: 0.65
    playfulness: 0.15
    boredom: 0.05
    anxiety: 0.10

  sassy:
    happiness: 0.60
    anger: 0.20
    sadness: 0.05
    affection: 0.30
    energy: 0.75
    playfulness: 0.75
    boredom: 0.15
    anxiety: 0.05

  chill:
    happiness: 0.60
    anger: 0.02
    sadness: 0.05
    affection: 0.45
    energy: 0.35
    playfulness: 0.35
    boredom: 0.10
    anxiety: 0.02

  professional:
    happiness: 0.50
    anger: 0.00
    sadness: 0.02
    affection: 0.20
    energy: 0.60
    playfulness: 0.00
    boredom: 0.05
    anxiety: 0.05

# Half-lives for exponential decay towards baseline in seconds
decay_half_lives:
  happiness: 1800
  anger: 300
  sadness: 900
  affection: 3600
  energy: 1200
  playfulness: 600
  boredom: 900
  anxiety: 600

# Dominant emotion calculation formulas and weights
emotion_formulas:
  happy:
    happiness: 0.60
    energy: 0.25
    playfulness: 0.15
    sadness: -0.40
    anger: -0.30
  excited:
    energy: 0.40
    happiness: 0.35
    playfulness: 0.25
    boredom: -0.30
  smug:
    playfulness: 0.45
    happiness: 0.30
    energy: 0.25
    anxiety: -0.40
  romantic:
    affection: 0.70
    happiness: 0.30
    energy: 0.10
    anger: -0.40
    boredom: -0.20
  shy:
    affection: 0.40
    anxiety: 0.40
    happiness: 0.20
    energy: -0.30
  sad:
    sadness: 0.70
    anxiety: 0.20
    happiness: -0.50
  angry:
    anger: 0.80
    energy: 0.20
    happiness: -0.50
    affection: -0.30
  sleepy:
    energy: -0.60
    boredom: 0.30
    anxiety: -0.40
  bored:
    boredom: 0.60
    energy: -0.30
    playfulness: -0.30
    happiness: -0.30
  thinking:
    anxiety: 0.30
    playfulness: -0.30
    energy: -0.20

# Hysteresis parameters
hysteresis:
  margin: 0.15
  min_dwell_s: 4.0

# Lexicon keyword lists for appraisal
