<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anya - Expression Debug Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111418;
            color: #e2e8f0;
        }
        #canvas-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* PIXI appends its canvas to body; make it fill behind the panel */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
            background: transparent;
        }
        .debug-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            width: 240px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            background: rgba(18, 22, 30, 0.82);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .debug-panel h2 {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #f472b6;
            margin-bottom: 4px;
        }
        .status {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .status span.active-expr {
            color: #38bdf8;
            font-weight: 600;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }
        button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #cbd5e1;
            padding: 7px 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }
        button:hover {
            background: rgba(244, 114, 182, 0.2);
            border-color: #f472b6;
            color: #ffffff;
            transform: translateY(-1px);
        }
        button.active {
            background: #f472b6;
            border-color: #f472b6;
            color: #0f172a;
            font-weight: 700;
        }
        button.clear-btn {
            grid-column: span 2;
            background: rgba(239, 68, 68, 0.18);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
        button.clear-btn:hover {
            background: rgba(239, 68, 68, 0.35);
            color: #ffffff;
        }
    </style>

    <!-- Pinned Live2D Cubism Core & PIXI Runtime -->
    <script src="vendor/live2dcubismcore.min.js"></script>
    <script src="vendor/pixi.min.js"></script>
    <script src="vendor/cubism4.min.js"></script>
    <script src="vendor/qwebchannel.js"></script>
</head>
<body>
    <div class="debug-panel">
        <h2>Anya Expressions</h2>
        <div class="status">
            <span>Current: <span id="current-name" class="active-expr">Neutral</span></span>
            <span id="fps-counter">30 FPS</span>
        </div>
        <div class="btn-grid" id="button-container">
            <!-- Buttons dynamically populated -->
        </div>
        <button id="clear-btn" class="clear-btn">Clear Expression</button>
    </div>

    <script src="avatar.js"></script>
    <script src="blend.js"></script>
    <script src="animation.js"></script>

    <script>
        const EXPRESSIONS = [
            "Angry", "Bored", "Excited", "Happy",
            "Pout", "Romantic", "Sad", "Scared",
            "Shining_eyes", "Shy", "Sleepy", "Smile_1",
            "Smug", "Surprise", "Thinking"
        ];

        const container = document.getElementById("button-container");
        const currentNameEl = document.getElementById("current-name");
        const clearBtn = document.getElementById("clear-btn");
        let activeButton = null;

        EXPRESSIONS.forEach(name => {
            const btn = document.createElement("button");
            btn.textContent = name;
            btn.onclick = () => {
                if (window.anya && typeof window.anya.setExpression === "function") {
                    window.anya.setExpression(name);
                }
                currentNameEl.textContent = name;
                if (activeButton) activeButton.classList.remove("active");
                btn.classList.add("active");
                activeButton = btn;
            };
            container.appendChild(btn);
        });

        clearBtn.onclick = () => {
            if (window.anya && typeof window.anya.clearExpression === "function") {
                window.anya.clearExpression();
            }
            currentNameEl.textContent = "Neutral";
            if (activeButton) activeButton.classList.remove("active");
            activeButton = null;
        };

        // Update FPS display from PIXI Ticker
        setInterval(() => {
            if (window.PIXI && PIXI.Ticker && PIXI.Ticker.shared) {
                const fps = Math.round(PIXI.Ticker.shared.FPS || 0);
                document.getElementById("fps-counter").textContent = fps + " FPS";
            }
        }, 500);
    </script>
</body>
</html>
