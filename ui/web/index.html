<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anya Live2D Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        /* PIXI appends its <canvas> to <body>; make it fill the page */
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
        }
    </style>

    <!-- Pinned Live2D Cubism Core & PIXI Runtime -->
    <script src="vendor/live2dcubismcore.min.js"></script>
    <script src="vendor/pixi.min.js"></script>
    <script src="vendor/cubism4.min.js"></script>
    <script src="vendor/qwebchannel.js"></script>
</head>
<body>
    <!-- No explicit <canvas> – avatar.js uses resizeTo:window and appends its own -->
    <script src="avatar.js"></script>
    <script src="blend.js"></script>
    <script src="animation.js"></script>
</body>
</html>
